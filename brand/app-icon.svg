<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <title>Minder app icon</title>
  <desc>The Michroma M with a lit rim over the Orbital background. The M outline is converted from app/assets/fonts/Michroma-Regular.ttf (SIL OFL).</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#f2f2f2"/><stop offset=".4" stop-color="#f2f2f2" stop-opacity=".22"/><stop offset="1" stop-color="#f2f2f2" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit-line" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#f2f2f2" stop-opacity=".75"/><stop offset=".5" stop-color="#f2f2f2" stop-opacity=".12"/><stop offset="1" stop-color="#f2f2f2" stop-opacity=".5"/></linearGradient>
    <linearGradient id="body" x1="86" y1="30" x2="24" y2="78" gradientUnits="userSpaceOnUse"><stop stop-color="#e6e6e6"/><stop offset="1" stop-color="#6e6e6e"/></linearGradient>
    <linearGradient id="rim" x1="86" y1="30" x2="24" y2="78" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <path id="letter" d="M28 70.53V37.47H34.16L54.15 64.44L73.84 37.47H80V70.53H75.87V41.22L56.13 68.36H52.39L32.13 41.22V70.53Z"/>
  </defs>
  <g id="minder-orbit">
    <rect width="108" height="108" fill="#0a0a0a"/>
    <g id="orbit-art">
    <ellipse cx="118" cy="-8" rx="62" ry="40" transform="rotate(-35 118 -8)" fill="url(#halo)" opacity=".6"/>
    <g fill="none" stroke="url(#orbit-line)" stroke-width=".9">
      <ellipse cx="54" cy="58" rx="62" ry="46" transform="rotate(-28 54 58)"/>
      <ellipse cx="62" cy="50" rx="48" ry="64" transform="rotate(18 62 50)"/>
      <circle cx="92" cy="22" r="30"/>
    </g>
    </g>
  </g>
  <g id="minder-mark">
    <use href="#letter" fill="none" stroke="url(#rim)" stroke-width="2" opacity=".55" filter="url(#soft)"/>
    <use href="#letter" fill="url(#body)"/>
    <use href="#letter" fill="none" stroke="url(#rim)" stroke-width=".4"/>
  </g>
</svg>
