name: minder
description: Personal task assistant.
publish_to: none
version: 0.4.7+16
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0
  http: ^1.5.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Michroma
      fonts:
        - asset: assets/fonts/Michroma-Regular.ttf
    - family: Chakra Petch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
